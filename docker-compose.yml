services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: julex-api
    environment:
      - PORT=5000
      - DATABASE_URL=file:/data/julex.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - NODE_ENV=production
    volumes:
      - julex-db:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/api/health']
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build: .
    container_name: julex-web
    depends_on:
      - backend
    ports:
      - '3000:80'
    restart: unless-stopped

volumes:
  julex-db:
