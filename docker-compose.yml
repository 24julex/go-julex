services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
      network: host
    # Public resolvers: the host's systemd-resolved (127.0.0.53) is not
    # reachable from containers.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: julex-api
    ports:
      - '127.0.0.1:5000:5000'
    environment:
      - PORT=5000
      - DATABASE_URL=file:/data/julex.db
      - UPLOAD_DIR=/data/uploads
      - JWT_SECRET=${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-0}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:-}
      - ALLOW_DEV_OTP=${ALLOW_DEV_OTP:-}
      - SMTP_HOST=${SMTP_HOST:-127.0.0.1}
      - SMTP_PORT=${SMTP_PORT:-25}
      - MAIL_FROM=${MAIL_FROM:-Go Julex <no-reply@julex.shop>}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - NODE_ENV=production
    volumes:
      - julex-db:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/api/health']
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      network: host
    container_name: julex-web
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - API_HOST=host.docker.internal
      - API_PORT=5000
    ports:
      - '3000:80'
    restart: unless-stopped

volumes:
  julex-db:
